apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hik-web.fullname" . }}-secrets
  labels:
    {{- include "hik-web.labels" . | nindent 4 }}
type: Opaque
data:
  cam-password: {{ required "config.camPassword is required (the family password)" .Values.config.camPassword | b64enc | quote }}
  session-secret: {{ required "config.sessionSecret is required (random string, e.g. openssl rand -hex 32)" .Values.config.sessionSecret | b64enc | quote }}
