<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Camera lớp">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/app.css">
<title>Camera lớp</title>
</head>
<body>
<div class="login" id="login" hidden>
  <form id="login-form">
    <div class="brand">
      <img src="/static/icons/icon-192.png" alt="">
      <div><h1>Camera lớp</h1><div class="sub">Xem camera lớp của con</div></div>
    </div>
    <label for="password">Mật khẩu gia đình</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit" id="loginBtn">Vào xem</button>
    <div class="err" id="err"></div>
    <div class="hint">Nhập đúng một lần, máy này sẽ nhớ 30 ngày. Thêm trang vào màn hình chính để mở như app.</div>
  </form>
</div>

<div class="app" id="app" hidden>
  <header class="topbar">
    <img src="/static/icons/icon-192.png" alt="">
    <span class="title">Camera lớp</span>
    <span class="count" id="count"></span>
    <span class="spacer"></span>
    <button class="icon-btn" id="todayBtn" title="Ảnh chụp hôm nay" hidden>
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    </button>
    <button class="icon-btn" id="layoutBtn" title="Đổi bố cục">
      <svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/></svg>
    </button>
    <button class="icon-btn" id="refreshBtn" title="Tải lại danh sách camera">
      <svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
    </button>
    <button class="icon-btn" id="logoutBtn" title="Đăng xuất">
      <svg class="i" viewBox="0 0 24 24"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/></svg>
    </button>
  </header>
  <main class="grid" id="grid"></main>
  <section class="today" id="today" hidden>
    <div class="today-head">
      <div>
        <div class="today-title">Hôm nay <span id="todayDate"></span></div>
        <div class="today-sub" id="todaySub"></div>
      </div>
      <button class="icon-btn" id="todayClose" title="Đóng">
        <svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="todayBody"></div>
  </section>
</div>

<script src="/static/hls.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
