# Default values for hik-stream. Override per environment with --set / -f my-values.yaml.

# Do NOT scale above 1: every channel is one SDK session on the recorder; two pods = duplicate logins.
replicaCount: 1

image:
  # Public image, contains no Hikvision code: the SDK is downloaded into /sdk when the pod starts
  repository: docker.io/phuthuycoding/hik-connect-proxy-viewer-stream
  pullPolicy: Always
  tag: ""

# e.g. --set imagePullSecrets[0].name=my-registry-secret (not needed for Docker Hub public images)
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

config:
  # Recorder (NVR/DVR) account handed out by the school. REQUIRED at install time (helm fails if empty):
  #   --set config.hik.domain=... --set config.hik.user=... --set config.hik.password=...
  hik:
    domain: ""
    # SDK port, 8000 by default; schools often map it to another port
    sdkPort: "8000"
    user: ""
    password: ""
    # "1" = sub stream (lighter), "0" = main stream
    sub: "0"
  # ffmpeg inside the pod publishes RTSP to mediamtx in the same pod; this user is declared in files/mediamtx.yml
  publish:
    user: puller
    password: puller-secret
  # Optional: URL of the Hikvision SDK zip you host yourself. Empty = download from hikvision.com at pod start.
  sdkZipUrl: ""
  # Re-probe which channels the account may view (seconds)
  discoverRefreshSeconds: "21600"

# The SDK download (~70MB) lands here; emptyDir means one download per pod start
sdkVolume:
  emptyDir: {}

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  hlsPort: 8888
  discoveryPort: 9000

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

# mediamtx has no dedicated health endpoint; probe the HLS port. Startup waits for the SDK download.
startupProbe:
  enabled: true
  tcpSocket:
    port: 8888
  periodSeconds: 5
  failureThreshold: 60

livenessProbe:
  enabled: true
  tcpSocket:
    port: 8888
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  tcpSocket:
    port: 8888
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# The SDK is x86_64 only
nodeSelector:
  kubernetes.io/arch: amd64

tolerations: []

affinity: {}
