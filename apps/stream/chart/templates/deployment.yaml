apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hik-stream.fullname" . }}
  labels:
    {{- include "hik-stream.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate: never let an old and a new pod log in to the recorder at the same time
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hik-stream.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "hik-stream.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hik-stream.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: hls
              containerPort: 8888
              protocol: TCP
            - name: discovery
              containerPort: 9000
              protocol: TCP
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            tcpSocket:
              port: {{ .Values.startupProbe.tcpSocket.port }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.livenessProbe.tcpSocket.port }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.readinessProbe.tcpSocket.port }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: HIK_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "hik-stream.fullname" . }}-secrets
                  key: hik-domain
            - name: HIK_SDK_PORT
              value: {{ .Values.config.hik.sdkPort | quote }}
            - name: HIK_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "hik-stream.fullname" . }}-secrets
                  key: hik-user
            - name: HIK_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "hik-stream.fullname" . }}-secrets
                  key: hik-password
            - name: HIK_SUB
              value: {{ .Values.config.hik.sub | quote }}
            - name: MTX_PUBLISH_BASE
              value: "rtsp://{{ .Values.config.publish.user }}:{{ .Values.config.publish.password }}@127.0.0.1:8554"
            - name: DISCOVER_REFRESH_SECONDS
              value: {{ .Values.config.discoverRefreshSeconds | quote }}
            {{- if .Values.config.sdkZipUrl }}
            - name: HCNETSDK_ZIP_URL
              value: {{ .Values.config.sdkZipUrl | quote }}
            {{- end }}
          volumeMounts:
            - name: mediamtx-config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
              readOnly: true
            - name: sdk
              mountPath: /sdk
      volumes:
        - name: mediamtx-config
          configMap:
            name: {{ include "hik-stream.fullname" . }}-config
        - name: sdk
          {{- toYaml .Values.sdkVolume | nindent 10 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
