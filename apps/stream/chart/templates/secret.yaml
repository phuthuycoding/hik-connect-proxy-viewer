apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hik-stream.fullname" . }}-secrets
  labels:
    {{- include "hik-stream.labels" . | nindent 4 }}
type: Opaque
data:
  hik-domain: {{ required "config.hik.domain is required (recorder hostname or IP)" .Values.config.hik.domain | b64enc | quote }}
  hik-user: {{ required "config.hik.user is required" .Values.config.hik.user | b64enc | quote }}
  hik-password: {{ required "config.hik.password is required" .Values.config.hik.password | b64enc | quote }}
