name: Release

# This repo only publishes artifacts. Deploying is your business: install the chart with your own values
# (see README). Nothing here knows about your cluster, domain or passwords.
#
#   push to master  -> images tagged `latest` and `sha-<commit>` on Docker Hub
#   push tag vX.Y.Z -> images tagged `X.Y.Z` (+ latest) and the Helm chart version X.Y.Z on GHCR (OCI)
#
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (access token, read/write/delete scope so descriptions can be updated too).
# GHCR uses GITHUB_TOKEN.

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # GitHub Release on tags
  packages: write

env:
  DOCKERHUB_NAMESPACE: phuthuycoding
  IMAGE_BASENAME: hik-connect-proxy-viewer

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [stream, web]
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_BASENAME }}-${{ matrix.app }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./apps/${{ matrix.app }}
          # The SDK is x86_64 only; the web image could be multi-arch but one platform keeps it simple
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

      # Docker Hub page text (SEO): short description + apps/<app>/README.md. Needs a PAT with read/write/delete scope.
      - name: Update Docker Hub description
        if: github.ref == 'refs/heads/master'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_BASENAME }}-${{ matrix.app }}
          short-description: "${{ matrix.app == 'stream' && 'Hik-Connect/Hikvision SDK stream proxy: HCNetSDK to HLS via mediamtx, on demand, auto channels' || 'Web app for hik-connect-proxy-viewer: family password login, PWA, auto camera grid, HLS proxy' }}"
          readme-filepath: ./apps/${{ matrix.app }}/README.md

  chart:
    # The chart is versioned by the git tag so that chart appVersion == image tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Lint, package and push
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          helm lint chart --set hik.domain=x --set hik.user=x --set hik.password=x \
            --set web.password=x --set web.sessionSecret=x
          mkdir -p dist
          helm package chart --version "$VERSION" --app-version "$VERSION" -d dist
          helm push dist/*.tgz "oci://ghcr.io/$OWNER/charts"
          echo "## Published chart hik-connect-proxy-viewer $VERSION" >> $GITHUB_STEP_SUMMARY

      # GitHub Release with generated notes and the chart tarball attached (skipped if it already exists)
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" dist/*.tgz --title "$GITHUB_REF_NAME" --generate-notes
