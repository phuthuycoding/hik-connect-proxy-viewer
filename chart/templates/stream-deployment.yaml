apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hcpv.streamName" . }}
  labels:
    {{- include "hcpv.labels" . | nindent 4 }}
    app.kubernetes.io/component: stream
spec:
  # One replica, Recreate: every channel is one SDK session on the recorder; two pods = duplicate logins
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hcpv.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: stream
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "hcpv.labels" . | nindent 8 }}
        app.kubernetes.io/component: stream
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hcpv.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.stream.podSecurityContext | nindent 8 }}
      containers:
        - name: stream
          securityContext:
            {{- toYaml .Values.stream.securityContext | nindent 12 }}
          image: "{{ .Values.stream.image.repository }}:{{ .Values.stream.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.stream.image.pullPolicy }}
          ports:
            - name: hls
              containerPort: 8888
              protocol: TCP
            - name: discovery
              containerPort: 9000
              protocol: TCP
            - name: timelapse
              containerPort: 9001
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: hls
            periodSeconds: {{ .Values.stream.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.stream.startupProbe.failureThreshold }}
          livenessProbe:
            tcpSocket:
              port: hls
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: hls
            periodSeconds: 10
          resources:
            {{- toYaml .Values.stream.resources | nindent 12 }}
          env:
            - name: HIK_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "hcpv.fullname" . }}-secrets
                  key: hik-domain
            - name: HIK_SDK_PORT
              value: {{ .Values.hik.sdkPort | quote }}
            - name: HIK_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "hcpv.fullname" . }}-secrets
                  key: hik-user
            - name: HIK_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "hcpv.fullname" . }}-secrets
                  key: hik-password
            - name: HIK_SUB
              value: {{ .Values.hik.sub | quote }}
            - name: MTX_PUBLISH_BASE
              value: "rtsp://{{ .Values.stream.publish.user }}:{{ .Values.stream.publish.password }}@127.0.0.1:8554"
            - name: DISCOVER_REFRESH_SECONDS
              value: {{ .Values.stream.discoverRefreshSeconds | quote }}
            {{- if .Values.stream.sdkZipUrl }}
            - name: HCNETSDK_ZIP_URL
              value: {{ .Values.stream.sdkZipUrl | quote }}
            {{- end }}
            - name: TIMELAPSE_ENABLED
              value: {{ ternary "1" "0" .Values.timelapse.enabled | quote }}
            {{- if .Values.timelapse.enabled }}
            - name: TIMELAPSE_TZ
              value: {{ .Values.timelapse.timezone | quote }}
            - name: TIMELAPSE_DAYS
              value: {{ .Values.timelapse.days | quote }}
            - name: TIMELAPSE_START
              value: {{ .Values.timelapse.start | quote }}
            - name: TIMELAPSE_END
              value: {{ .Values.timelapse.end | quote }}
            - name: TIMELAPSE_INTERVAL_MINUTES
              value: {{ .Values.timelapse.intervalMinutes | quote }}
            - name: TIMELAPSE_SEND_AT
              value: {{ .Values.timelapse.sendAt | quote }}
            - name: TIMELAPSE_FPS
              value: {{ .Values.timelapse.fps | quote }}
            - name: TIMELAPSE_CHANNELS
              value: {{ .Values.timelapse.channels | quote }}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "hcpv.fullname" . }}-secrets
                  key: telegram-bot-token
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "hcpv.fullname" . }}-secrets
                  key: telegram-chat-id
            {{- end }}
          volumeMounts:
            - name: mediamtx-config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
              readOnly: true
            - name: sdk
              mountPath: /sdk
            - name: data
              mountPath: /data
      volumes:
        - name: mediamtx-config
          configMap:
            name: {{ include "hcpv.streamName" . }}-config
        - name: sdk
          {{- toYaml .Values.stream.sdkVolume | nindent 10 }}
        - name: data
          {{- if .Values.timelapse.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.timelapse.storage.existingClaim | default (printf "%s-data" (include "hcpv.streamName" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.stream.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.stream.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.stream.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
