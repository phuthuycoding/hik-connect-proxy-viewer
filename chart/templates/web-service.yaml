apiVersion: v1
kind: Service
metadata:
  name: {{ include "hcpv.webName" . }}
  labels:
    {{- include "hcpv.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "hcpv.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
