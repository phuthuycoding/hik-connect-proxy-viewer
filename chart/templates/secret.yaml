apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hcpv.fullname" . }}-secrets
  labels:
    {{- include "hcpv.labels" . | nindent 4 }}
type: Opaque
data:
  hik-domain: {{ required "hik.domain is required (recorder hostname or IP)" .Values.hik.domain | b64enc | quote }}
  hik-user: {{ required "hik.user is required" .Values.hik.user | b64enc | quote }}
  hik-password: {{ required "hik.password is required" .Values.hik.password | b64enc | quote }}
  web-password: {{ required "web.password is required (the family password)" .Values.web.password | b64enc | quote }}
  web-session-secret: {{ required "web.sessionSecret is required (random string, e.g. openssl rand -hex 32)" .Values.web.sessionSecret | b64enc | quote }}
